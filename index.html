<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyber Sanctum — Portal & Expeditions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="preload" as="image" href="clouds_canyon.jpg" />
  <link rel="stylesheet" href="style.css?v=cloud3" />
</head>
<body>

  <!-- ========================================================================= -->
  <!-- SCREEN 1 (PAGE 1): GOOGLE SIGN-IN DIALOGUE ONLY                           -->
  <!-- ========================================================================= -->
  <section class="screen-view active" id="pageLogin">
    <!-- Portal Backdrop Scene -->
    <div class="portal-scene">
      <div class="portal-backdrop"></div>
      <canvas id="portalSparksCanvas"></canvas>
      <div class="portal-vignette"></div>
      <div class="warp-flash" id="warpFlash"></div>
    </div>

    <!-- Centered Glassmorphism Dialogue Box -->
    <main class="auth-dialog-wrapper">
      <div class="auth-dialog-card" id="loginCard">
        <div class="card-glow"></div>
        <div class="dialog-sigil-icon">✦</div>
        
        <header class="dialog-header">
          <h1 class="dialog-title">Sign In</h1>
          <p class="dialog-subtitle">Authenticate to access the portal chamber</p>
          <div class="title-underline"></div>
        </header>

        <div class="dialog-action-area">
          <button type="button" class="btn-google" id="btnGoogleLogin" aria-label="Login with Google">
            <svg class="google-icon" viewBox="0 0 24 24" width="22" height="22">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
            </svg>
            <span class="google-text">Login with Google</span>
          </button>
        </div>
      </div>
    </main>
  </section>

  <!-- ========================================================================= -->
  <!-- SCREEN 2 (PAGE 2): ACCESS CODE ENTRY DIALOGUE                             -->
  <!-- ========================================================================= -->
  <section class="screen-view" id="pageAccessCode">
    <!-- Portal Backdrop Scene -->
    <div class="portal-scene">
      <div class="portal-backdrop"></div>
      <div class="portal-vignette"></div>
    </div>

    <!-- Centered Glassmorphism Dialogue Box -->
    <main class="auth-dialog-wrapper">
      <div class="auth-dialog-card" id="accessCodeCard">
        <div class="card-glow"></div>
        <div class="dialog-sigil-icon">❖</div>

        <header class="dialog-header">
          <h1 class="dialog-title">Sanctum Access</h1>
          <p class="dialog-subtitle">Enter your clearance code to unlock the gateway</p>
          <div class="title-underline"></div>
        </header>

        <form class="auth-form" id="accessCodeForm" onsubmit="return false;">
          <div class="input-group">
            <input 
              type="text" 
              id="accessCodeInput" 
              class="code-input" 
              placeholder="Enter access code..." 
              autocomplete="off" 
              spellcheck="false" 
              aria-label="Access Code"
            />
            <div class="input-hint">Tip: Enter your code or press Submit to enter</div>
          </div>

          <button type="submit" class="btn-submit" id="btnSubmitCode" aria-label="Submit Access Code">
            <span class="btn-text">Submit</span>
            <div class="btn-glow"></div>
          </button>

          <div class="card-status-message" id="codeStatusMsg"></div>
        </form>
      </div>
    </main>
  </section>

  <!-- ========================================================================= -->
  <!-- PORTAL CINEMATIC WARP TRANSITION                                          -->
  <!-- ========================================================================= -->
  <section class="screen-view" id="portalTransitionSection">
    <div class="video-container">
      <video id="portalVideo" playsinline preload="auto" poster="portal_hall_2d_original.png">
        <source src="Video Project.mp4" type="video/mp4" />
      </video>
      <div class="portal-vignette"></div>
      <div class="warp-flash" id="transitionWarpFlash"></div>
    </div>
  </section>

  <!-- Atmospheric 3D Clouds Fly-Through & Chasm Overlay (Fixed Fullscreen) -->
  <div class="clouds-parting-overlay" id="cloudsOverlay" aria-hidden="true">
    <div class="cloud-canyon-perspective">
      <!-- Left Cumulus Cloud Bank -->
      <div class="cloud-canyon-side canyon-bank-left">
        <img src="clouds_canyon.jpg" class="canyon-img canyon-img-left" alt="Clouds Left" />
      </div>

      <!-- Right Cumulus Cloud Bank -->
      <div class="cloud-canyon-side canyon-bank-right">
        <img src="clouds_canyon.jpg" class="canyon-img canyon-img-right" alt="Clouds Right" />
      </div>

      <!-- Radiant Center Golden Horizon Portal Flare -->
      <div class="canyon-horizon-portal"></div>
    </div>
  </div>

  <!-- ========================================================================= -->
  <!-- SCREEN 3 (PAGE 3): MINIMALIST DASHBOARD & SINGLE MEDIEVAL DUNGEON GATE    -->
  <!-- ========================================================================= -->
  <section class="screen-view" id="pageDashboard">
    <!-- Ambient Starfield & Vortex Canvas -->
    <div class="emberkeep-bg">
      <div class="stars-layer"></div>
      <div class="sanctum-ambient-vortex"></div>
      <canvas id="cavernParticlesCanvas"></canvas>
    </div>

    <div class="dashboard-page-content">
      <!-- Minimalist Top Navigation -->
      <nav class="emberkeep-nav">
        <div class="nav-left">
          <div class="nav-logo-circle" aria-hidden="true">
            <span class="sigil-inner">✦</span>
          </div>
          <span class="nav-event-title" id="navEventTitle">Cybersecurity Classes</span>
        </div>

        <div class="nav-right">
          <!-- SFX Toggle Button -->
          <button class="nav-sfx-btn" id="navSoundToggleBtn" title="Toggle Sound FX" aria-label="Toggle Sound Effects">
            <svg class="sfx-icon-on" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
            <svg class="sfx-icon-off hidden" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <line x1="23" y1="9" x2="17" y2="15"></line>
              <line x1="17" y1="9" x2="23" y2="15"></line>
            </svg>
            <span class="nav-sfx-label" id="navSfxLabel">SFX: ON</span>
          </button>

          <!-- Adventurer Profile Button with Logout Dropdown -->
          <div class="profile-menu-container">
            <button class="nav-avatar-btn" id="avatarBtn" title="Adventurer Profile" aria-label="Open Adventurer Profile" aria-expanded="false">
              <img src="user_avatar.png" class="nav-avatar-img" alt="Adventurer" />
              <div class="user-badge-online"></div>
            </button>

            <!-- Profile Dropdown Popup -->
            <div class="profile-dropdown" id="profileDropdown" aria-hidden="true">
              <div class="dropdown-header">
                <img src="user_avatar.png" class="dropdown-avatar-img" alt="User Avatar" />
                <div class="dropdown-user-info">
                  <span class="dropdown-name">Adventurer</span>
                  <span class="dropdown-role">Term IV Initiate</span>
                </div>
              </div>
              <div class="dropdown-divider"></div>
              <button type="button" class="dropdown-logout-btn" id="btnLogout" aria-label="Logout">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                  <polyline points="16 17 21 12 16 7"></polyline>
                  <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                <span>Logout</span>
              </button>
            </div>
          </div>
        </div>
      </nav>

      <!-- Main Content Area: Centered Introduction & Single Medieval Dungeon Gate -->
      <main class="dashboard-center-stage">
      <!-- Introduction Button -->
      <div class="intro-action-container">
        <button class="btn-introduction" id="btnIntroduction" aria-label="Open Introduction">
          <span class="btn-intro-aura"></span>
          <span class="btn-intro-shimmer"></span>
          <span class="btn-intro-sparkle">✦</span>
          <span class="btn-intro-text">Introduction</span>
          <span class="btn-intro-arrow">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </span>
        </button>
        <p class="intro-status-caption" id="introNotice">Click Introduction to break the seal and unlock the dungeon gate.</p>
      </div>

      <!-- Single Handcrafted Medieval Stone Arch Wooden Gate -->
      <div class="single-dungeon-gate-wrap" id="dungeonGateWrap">
        <!-- Master SVG Definitions for Crisp Vector Gate -->
        <svg class="svg-defs-only" aria-hidden="true" style="position: absolute; width: 0; height: 0; overflow: hidden;">
          <defs id="sharedGateDefs">
            <radialGradient id="gfShadow" cx="50%" cy="50%" rx="50%" ry="50%">
              <stop offset="0%" stop-color="#02040a" stop-opacity="0.95" />
              <stop offset="65%" stop-color="#02040a" stop-opacity="0.4" />
              <stop offset="100%" stop-color="#080e22" stop-opacity="0" />
            </radialGradient>

            <radialGradient id="gfSpill" cx="50%" cy="35%" rx="50%" ry="50%">
              <stop offset="0%" stop-color="#ffb833" stop-opacity="0.65" />
              <stop offset="50%" stop-color="#d96800" stop-opacity="0.25" />
              <stop offset="100%" stop-color="#080e22" stop-opacity="0" />

              <stop offset="80%" stop-color="#8d959c" />
              <stop offset="100%" stop-color="#70787f" />

            <linearGradient id="stSide" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#c1c7cc" />
              <stop offset="45%" stop-color="#939aa1" />
              <stop offset="100%" stop-color="#646b72" />
            </linearGradient>

            <linearGradient id="wdPlankA" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#804a1f" />
              <stop offset="25%" stop-color="#a46931" />
              <stop offset="75%" stop-color="#b67a3f" />
              <stop offset="100%" stop-color="#723f18" />
            </linearGradient>

            <linearGradient id="wdPlankB" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#693710" />
              <stop offset="25%" stop-color="#965c27" />
              <stop offset="70%" stop-color="#a86d34" />
              <stop offset="100%" stop-color="#5f2e0b" />
            </linearGradient>

            <linearGradient id="irMetal" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#948580" />
              <stop offset="25%" stop-color="#70625d" />
              <stop offset="65%" stop-color="#4d403d" />
              <stop offset="100%" stop-color="#2d2220" />
            </linearGradient>

            <linearGradient id="irRidge" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#e8dedb" stop-opacity="0.9" />
              <stop offset="50%" stop-color="#988985" stop-opacity="0.6" />
              <stop offset="100%" stop-color="#362927" stop-opacity="0.3" />
            </linearGradient>

            <radialGradient id="portalBurst" cx="50%" cy="50%" r="50%">

              <stop offset="20%" stop-color="#fff0b8" />
              <stop offset="50%" stop-color="#ffaa1d" />
              <stop offset="85%" stop-color="#c44e00" />
              <stop offset="100%" stop-color="#1e0c02" />
            </radialGradient>

            <filter id="shDrop" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.65" />
            </filter>

            <!-- Master Door Leaf -->
            <g id="doorLeafShape" filter="url(#shDrop)">
              <path d="M 89 284 L 89 138 C 89 76, 231 76, 231 138 L 231 284 Z" fill="#241308" />
              <!-- Planks -->
              <path d="M 90 284 L 90 142 C 90 114, 103 96, 113 88 L 113 284 Z" fill="url(#wdPlankA)" stroke="#2b1407" stroke-width="1.2" />

              <path d="M 184 284 L 184 76 C 195 81, 204 88, 211 96 L 211 284 Z" fill="url(#wdPlankA)" stroke="#2b1407" stroke-width="1.2" />

                <path d="M 107 249 L 196 249 L 224 249" stroke="url(#irRidge)" stroke-width="2.2" fill="none" stroke-linecap="round" />

                <path d="M 107 258 L 195 256 L 210 264 L 224 249" stroke="#120d0c" stroke-width="1.4" fill="none" />
                <circle cx="132" cy="249" r="2.8" fill="#1a1412" /><circle cx="131.5" cy="248.5" r="1.7" fill="#887a75" />
                <circle cx="174" cy="249" r="2.8" fill="#1a1412" /><circle cx="173.5" cy="248.5" r="1.7" fill="#887a75" />
                <circle cx="208" cy="249" r="2.4" fill="#1a1412" /><circle cx="207.5" cy="248.5" r="1.5" fill="#887a75" />
              </g>

              <!-- Ring Knocker -->
              <g>
                <rect x="204" y="196" width="18" height="26" rx="3.5" fill="#251c1a" stroke="#140f0e" stroke-width="1.2" />
                <rect x="205" y="197" width="16" height="24" rx="2.5" fill="url(#irMetal)" />

            <!-- Master Stone Arch Template -->
            <g id="stoneArchShape">
              <!-- Plinths -->
              <path d="M 44 286 L 98 286 L 96 254 L 46 254 Z" fill="url(#stSide)" stroke="#262a2e" stroke-width="2" stroke-linejoin="round" />

              <path d="M 252 205 L 248 224 L 253 236" stroke="#444b52" stroke-width="1.3" fill="none" opacity="0.65" />

              <!-- Impost Blocks -->
              <path d="M 44 202 L 98 202 L 96 170 L 46 170 Z" fill="url(#stSide)" stroke="#262a2e" stroke-width="2" stroke-linejoin="round" />

              <path d="M 222 202 L 276 202 L 274 170 L 224 170 Z" fill="url(#stSide)" stroke="#262a2e" stroke-width="2" stroke-linejoin="round" />

              <path d="M 244 172 L 249 188" stroke="#444b52" stroke-width="1.2" fill="none" opacity="0.65" />

              <!-- Voussoirs 1 -->
              <path d="M 49 170 L 94 170 L 100 128 L 53 124 Z" fill="url(#stTop)" stroke="#262a2e" stroke-width="2" stroke-linejoin="round" />
              <path d="M 53 124 L 100 128" stroke="#f2f5f8" stroke-width="2.4" fill="none" />
              <path d="M 53 124 L 49 170" stroke="#f2f5f8" stroke-width="2" fill="none" />
